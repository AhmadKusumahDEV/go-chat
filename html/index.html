<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go-Chat WebSocket Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        h2 {
            color: #7c4dff;
            margin-bottom: 16px;
            font-size: 1.5rem;
        }

        /* Login Section */
        #loginSection {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        #loginSection h3 {
            color: #bb86fc;
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .form-row label {
            width: 80px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .form-row select,
        .form-row input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #3a3a5a;
            background: #16162a;
            color: #e0e0e0;
            font-size: 0.9rem;
        }

        .form-row select:focus,
        .form-row input:focus {
            outline: none;
            border-color: #7c4dff;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #7c4dff;
            color: white;
        }

        .btn-primary:hover {
            background: #651fff;
        }

        .btn-primary:disabled {
            background: #3a3a5a;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #cf6679;
            color: white;
        }

        .btn-danger:hover {
            background: #b00020;
        }

        .btn-danger:disabled {
            background: #3a3a5a;
            cursor: not-allowed;
        }

        .btn-success {
            background: #03dac6;
            color: #121212;
        }

        .btn-success:hover {
            background: #018786;
        }

        /* Status Badge */
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-connected {
            background: #03dac622;
            color: #03dac6;
            border: 1px solid #03dac644;
        }

        .status-disconnected {
            background: #cf667922;
            color: #cf6679;
            border: 1px solid #cf667944;
        }

        /* Chat Section */
        #chatSection {
            display: none;
        }

        .chat-header {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 12px 12px 0 0;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-tabs {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .room-tab {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #3a3a5a;
            background: #16162a;
            color: #aaa;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .room-tab.active {
            background: #7c4dff33;
            color: #bb86fc;
            border-color: #7c4dff;
        }

        .room-tab:hover {
            border-color: #7c4dff55;
        }

        /* Messages */
        #messages {
            height: 400px;
            overflow-y: auto;
            background: #12121f;
            border-left: 1px solid #2a2a4a;
            border-right: 1px solid #2a2a4a;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 75%;
            font-size: 0.88rem;
            word-break: break-word;
            line-height: 1.4;
        }

        .msg-sent {
            background: #7c4dff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg-received {
            background: #1e1e3a;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg-system {
            background: #2a2a4a44;
            color: #888;
            align-self: center;
            font-size: 0.78rem;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .msg-sender {
            font-size: 0.72rem;
            color: #bb86fc;
            margin-bottom: 3px;
        }

        .msg-time {
            font-size: 0.68rem;
            color: #888;
            margin-top: 3px;
            text-align: right;
        }

        .msg-error {
            background: #cf667922;
            color: #cf6679;
            align-self: center;
            border: 1px solid #cf667944;
            font-size: 0.8rem;
            padding: 8px 14px;
        }

        /* Input */
        .chat-input {
            display: flex;
            gap: 10px;
            padding: 14px 20px;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 0 0 12px 12px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #3a3a5a;
            background: #16162a;
            color: #e0e0e0;
            font-size: 0.9rem;
        }

        .chat-input input:focus {
            outline: none;
            border-color: #7c4dff;
        }

        /* Log */
        #logSection {
            margin-top: 20px;
        }

        #log {
            height: 150px;
            overflow-y: auto;
            background: #0a0a15;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 0.75rem;
        }

        #log p {
            margin-bottom: 2px;
        }

        .log-system {
            color: #888;
        }

        .log-ws {
            color: #03dac6;
        }

        .log-error {
            color: #cf6679;
        }

        /* User info bar */
        .user-bar {
            background: #16162a;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .user-bar span {
            color: #bb86fc;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🚀 Go-Chat WebSocket Tester</h2>

        <!-- LOGIN -->
        <div id="loginSection">
            <h3>🔐 Login</h3>
            <div class="form-row">
                <label>User:</label>
                <select id="userSelect">
                    <option value="john@example.com">john_doe (john@example.com)</option>
                    <option value="jane@example.com">jane_smith (jane@example.com)</option>
                    <option value="bob@example.com">bob_wilson (bob@example.com)</option>
                    <option value="alice@example.com">alice_johnson (alice@example.com)</option>
                    <option value="charlie@example.com">charlie_brown (charlie@example.com)</option>
                </select>
            </div>
            <div class="form-row">
                <label>Password:</label>
                <input type="password" id="passwordInput" value="test1234" placeholder="Password">
            </div>
            <div class="form-row" style="justify-content: flex-end; margin-top: 14px;">
                <button class="btn-primary" id="loginBtn" onclick="login()">Login & Connect WS</button>
            </div>
        </div>

        <!-- CHAT -->
        <div id="chatSection">
            <div class="user-bar">
                <div>Logged in as: <span id="loggedUser"></span></div>
                <div>
                    <span class="status status-disconnected" id="wsStatus">Disconnected</span>
                    <button class="btn-danger" onclick="logout()" style="margin-left: 8px;">Logout</button>
                </div>
            </div>

            <div class="chat-header">
                <div>
                    <strong>💬 Rooms</strong>
                    <div class="room-tabs" id="roomTabs"></div>
                </div>
            </div>
            <div id="messages"></div>
            <div class="chat-input">
                <input type="text" id="msgInput" placeholder="Type a message..." disabled>
                <button class="btn-primary" id="sendBtn" onclick="sendChat()" disabled>Send</button>
            </div>
        </div>

        <!-- LOG -->
        <div id="logSection">
            <h3 style="color: #666; margin-bottom: 8px; font-size: 0.85rem;">📋 Debug Log</h3>
            <div id="log"></div>
        </div>
    </div>

    <script>
        const API = 'https://madgo.my.id';
        let ws = null;
        let accessToken = '';
        let currentUser = null; // { user_id, username, email }
        let currentRoomID = '';
        const rooms = [
            { id: '11111111-1111-1111-1111-111111111111', name: 'General Chat' },
            { id: '22222222-2222-2222-2222-222222222222', name: 'Dev Team' }
        ];

        function log(msg, type = 'system') {
            const div = document.getElementById('log');
            const p = document.createElement('p');
            p.className = 'log-' + type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            div.appendChild(p);
            div.scrollTop = div.scrollHeight;
        }

        function addMessage(content, type = 'system', sender = '', time = '') {
            const div = document.getElementById('messages');
            const el = document.createElement('div');
            el.className = 'msg msg-' + type;

            let html = '';
            if (sender && type === 'received') {
                html += `<div class="msg-sender">${sender}</div>`;
            }
            html += content;
            if (time) {
                html += `<div class="msg-time">${time}</div>`;
            }
            el.innerHTML = html;
            div.appendChild(el);
            div.scrollTop = div.scrollHeight;
        }

        // Decode JWT payload (base64url → JSON) without a library
        function decodeJwtPayload(token) {
            const parts = token.split('.');
            if (parts.length !== 3) return null;
            const payload = parts[1].replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(atob(payload));
        }

        async function login() {
            const email = document.getElementById('userSelect').value;
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.textContent = 'Logging in...';
            log(`Logging in as ${email}...`);

            try {
                const res = await fetch(`${API}/api/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                log(`📦 Raw response: ${JSON.stringify(data)}`, 'ws');

                if (!res.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // API returns { "token": "...", "refresh_token": "..." }
                accessToken = data.token;
                const refreshToken = data.refresh_token;

                // Store tokens (like AsyncStorage on mobile)
                localStorage.setItem('access_token', accessToken);
                localStorage.setItem('refresh_token', refreshToken);

                // Decode user_info from JWT claims
                const claims = decodeJwtPayload(accessToken);
                log(`📦 JWT claims: ${JSON.stringify(claims)}`, 'ws');

                currentUser = claims.user_info || {
                    user_id: claims.user_id,
                    email: email,
                    username: email.split('@')[0]
                };

                log(`✅ Logged in! User ID: ${currentUser.user_id}`, 'ws');
                log(`Access Token: ${accessToken.substring(0, 30)}...`, 'ws');

                // Show chat, hide login
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('chatSection').style.display = 'block';
                document.getElementById('loggedUser').textContent = `${currentUser.username} (${currentUser.email})`;

                // Render room tabs
                renderRoomTabs();

                // Connect WebSocket
                connectWS();

            } catch (err) {
                log(`❌ Login failed: ${err.message}`, 'error');
                btn.disabled = false;
                btn.textContent = 'Login & Connect WS';
            }
        }

        function renderRoomTabs() {
            const container = document.getElementById('roomTabs');
            container.innerHTML = '';
            rooms.forEach((room, i) => {
                const tab = document.createElement('div');
                tab.className = 'room-tab' + (i === 0 ? ' active' : '');
                tab.textContent = room.name;
                tab.dataset.roomId = room.id;
                tab.onclick = () => switchRoom(room.id, tab);
                container.appendChild(tab);
            });
            // Auto-select first room
            currentRoomID = rooms[0].id;
        }

        // Fetch message history from REST API and render in chat-app order
        async function loadRoomMessages(roomId) {
            try {
                const res = await fetch(`${API}/api/message/${roomId}`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const json = await res.json();

                if (!res.ok) {
                    log(`⚠️ Failed to load messages: ${json.error || res.statusText}`, 'error');
                    return;
                }

                const messages = json.data || [];

                // DB returns newest-first (ORDER BY timestamp DESC).
                // Standard chat display = oldest at top, newest at bottom.
                // So we reverse the array before rendering.
                messages.reverse();

                messages.forEach(msg => {
                    const isMine = msg.sender_id === currentUser.user_id;
                    const time = msg.timestamp
                        ? new Date(msg.timestamp).toLocaleTimeString()
                        : '';
                    addMessage(
                        msg.content,
                        isMine ? 'sent' : 'received',
                        isMine ? 'You' : (msg.sender_name || msg.sender_id || 'Unknown'),
                        time
                    );
                });

                log(`📜 Loaded ${messages.length} messages for room ${roomId}`, 'ws');
            } catch (err) {
                log(`❌ Error loading messages: ${err.message}`, 'error');
            }
        }

        function switchRoom(roomId, tabEl) {
            // Leave old room
            if (currentRoomID && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'leave_room', room_id: currentRoomID }));
                log(`Left room: ${currentRoomID}`);
            }

            // Update UI
            document.querySelectorAll('.room-tab').forEach(t => t.classList.remove('active'));
            tabEl.classList.add('active');
            currentRoomID = roomId;
            document.getElementById('messages').innerHTML = '';

            // Join new room
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'join_room', room_id: roomId }));
                log(`Joined room: ${roomId}`, 'ws');
            }

            // Load message history
            loadRoomMessages(roomId);
        }

        function connectWS() {
            const wsUrl = `ws://localhost:8099/ws?token=${accessToken}`;
            log(`Connecting WebSocket...`);

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                log('✅ WebSocket connected!', 'ws');
                document.getElementById('wsStatus').className = 'status status-connected';
                document.getElementById('wsStatus').textContent = 'Connected';
                document.getElementById('msgInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;

                // Auto-join first room and load history
                if (currentRoomID) {
                    ws.send(JSON.stringify({ type: 'join_room', room_id: currentRoomID }));
                    log(`Auto-joined room: ${currentRoomID}`, 'ws');
                    loadRoomMessages(currentRoomID);
                }
            };

            ws.onmessage = (event) => {
                log(`⬇️ Received: ${event.data}`, 'ws');
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'error') {
                        addMessage(data.message, 'error');
                        return;
                    }

                    // It's a message response (from broadcast)
                    const senderLabel = data.sender_id === currentUser.user_id
                        ? 'You' : (data.sender_name || data.sender_id || 'Unknown');
                    const time = data.timestamp
                        ? new Date(data.timestamp).toLocaleTimeString()
                        : new Date().toLocaleTimeString();

                    addMessage(
                        data.content || JSON.stringify(data),
                        data.sender_id === currentUser.user_id ? 'sent' : 'received',
                        senderLabel,
                        time
                    );
                } catch {
                    // Raw text message
                    addMessage(event.data, 'received', '', new Date().toLocaleTimeString());
                }
            };

            ws.onclose = (event) => {
                log(`❌ WebSocket disconnected (code: ${event.code})`, 'error');
                document.getElementById('wsStatus').className = 'status status-disconnected';
                document.getElementById('wsStatus').textContent = 'Disconnected';
                document.getElementById('msgInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
            };

            ws.onerror = () => {
                log('⚠️ WebSocket error! Check browser console.', 'error');
            };
        }

        function sendChat() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;


            // Get sender name from currentUser (set during login)
            const senderName = currentUser ? currentUser.username : 'Unknown';

            const wsPayload = {
                type: 'message_group',
                room_id: currentRoomID,
                data: {
                    room_id: currentRoomID,
                    content: text,
                    message_type: 'text',
                    sender_name: senderName
                }
            };

            ws.send(JSON.stringify(wsPayload));
            log('Sent: ' + text, 'ws');


            // Show optimistic message
            addMessage(text, 'sent', 'You', new Date().toLocaleTimeString());
            input.value = '';
        }


        function logout() {
            if (ws) ws.close();
            accessToken = '';
            currentUser = null;
            currentRoomID = '';
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('chatSection').style.display = 'none';
            document.getElementById('messages').innerHTML = '';
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').textContent = 'Login & Connect WS';
            log('Logged out.');
        }

        // Enter to send
        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChat();
        });
    </script>
</body>

</html>
